<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background radial gradient (deep cosmos) -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%"  stop-color="#1B1140"/>
      <stop offset="55%" stop-color="#0B0820"/>
      <stop offset="100%" stop-color="#03010A"/>
    </radialGradient>

    <!-- Holographic gradient for the X mark -->
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00F0FF"/>
      <stop offset="28%"  stop-color="#7A5BFF"/>
      <stop offset="55%"  stop-color="#FF3FA4"/>
      <stop offset="80%"  stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FFD83D"/>
    </linearGradient>

    <!-- Inner highlight gradient -->
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Hex outer ring gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFD83D"/>
      <stop offset="50%"  stop-color="#FF3FA4"/>
      <stop offset="100%" stop-color="#7A5BFF"/>
    </linearGradient>

    <!-- Gold for "ULTRA PRO" badge -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFF1A8"/>
      <stop offset="50%"  stop-color="#FFC93D"/>
      <stop offset="100%" stop-color="#A6750C"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur stdDeviation="28" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha" result="bA"/>
      <feOffset dx="0" dy="8" in="bA" result="oA"/>
      <feComponentTransfer in="oA" result="sA">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="sA"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle symbol -->
    <symbol id="sparkle" viewBox="-10 -10 20 20" overflow="visible">
      <path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="#FFFFFF"/>
    </symbol>

    <!-- Hex path (rounded corners) -->
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- 1. Rounded square base (icon canvas) -->
  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Subtle grid lines for tech feel -->
    <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
      <path d="M0 256 H1024 M0 512 H1024 M0 768 H1024 M256 0 V1024 M512 0 V1024 M768 0 V1024"/>
    </g>

    <!-- Concentric glow rings -->
    <g opacity="0.55">
      <circle cx="512" cy="512" r="380" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.35"/>
      <circle cx="512" cy="512" r="320" fill="none" stroke="#FF3FA4" stroke-width="1.5" stroke-opacity="0.25"/>
      <circle cx="512" cy="512" r="260" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.22"/>
    </g>

    <!-- Big diffuse halo behind X -->
    <circle cx="512" cy="492" r="240" fill="#7A5BFF" opacity="0.35" filter="url(#glow)"/>
    <circle cx="512" cy="492" r="180" fill="#FF3FA4" opacity="0.40" filter="url(#glow)"/>

    <!-- Hex shield -->
    <g transform="translate(512 512)">
      <!-- outer hex -->
      <polygon points="0,-360 312,-180 312,180 0,360 -312,180 -312,-180"
               fill="none" stroke="url(#ring)" stroke-width="14" stroke-linejoin="round"
               filter="url(#glow)"/>
      <!-- inner hex (subtle) -->
      <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150"
               fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- The "X" play-mark -->
    <g transform="translate(512 492)" filter="url(#glow)">
      <!-- left bar of X -->
      <path d="M -200 -200 L -120 -200 L 0 -50 L 120 -200 L 200 -200 L 60 -10 L 200 180 L 120 180 L 0 30 L -120 180 L -200 180 L -60 -10 Z"
            fill="url(#holo)"/>
      <!-- inner sheen overlay -->
      <path d="M -200 -200 L -120 -200 L 0 -50 L 120 -200 L 200 -200 L 60 -10 L 200 180 L 120 180 L 0 30 L -120 180 L -200 180 L -60 -10 Z"
            fill="url(#holoSheen)"/>
      <!-- bright core highlight -->
      <path d="M -190 -190 L -130 -190 L 0 -30 L 130 -190 L 100 -180 L 0 -65 L -100 -180 Z"
            fill="#FFFFFF" opacity="0.55"/>
    </g>

    <!-- Play triangle accent inside X intersection -->
    <g transform="translate(512 492)">
      <circle r="42" fill="#0B0820" stroke="url(#holo)" stroke-width="4"/>
      <polygon points="-12,-18 22,0 -12,18" fill="#FFFFFF"/>
    </g>

    <!-- ULTRA PRO badge ribbon -->
    <g transform="translate(512 820)" filter="url(#softShadow)">
      <rect x="-200" y="-44" width="400" height="88" rx="44" ry="44" fill="#0B0820" stroke="url(#gold)" stroke-width="4"/>
      <text x="0" y="10" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif" font-weight="900"
            font-size="46" letter-spacing="10" fill="url(#gold)">ULTRA PRO</text>
      <!-- side stars -->
      <use href="#sparkle" x="-230" y="0" width="22" height="22"/>
      <use href="#sparkle" x="230"  y="0" width="22" height="22"/>
    </g>

    <!-- Sparkles scattered -->
    <g fill="#FFFFFF">
      <use href="#sparkle" x="180"  y="180" width="34" height="34" opacity="0.9"/>
      <use href="#sparkle" x="860"  y="220" width="22" height="22" opacity="0.8"/>
      <use href="#sparkle" x="900"  y="780" width="28" height="28" opacity="0.85"/>
      <use href="#sparkle" x="140"  y="760" width="20" height="20" opacity="0.7"/>
      <use href="#sparkle" x="780"  y="120" width="14" height="14" opacity="0.75"/>
      <use href="#sparkle" x="240"  y="900" width="14" height="14" opacity="0.65"/>
    </g>

    <!-- Top-edge highlight to imply 3D -->
    <rect x="0" y="0" width="1024" height="180" fill="url(#holoSheen)" opacity="0.18"/>
  </g>
</svg>
